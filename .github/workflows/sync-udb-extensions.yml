name: Sync UDB Extensions

on:
  # Run every Monday at 06:00 UTC
  schedule:
    - cron: '0 6 * * 1'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Note: the "Create Pull Request" step requires the repo/org setting
# "Allow GitHub Actions to create and approve pull requests" to be enabled.
permissions:
  contents: write
  pull-requests: write

# Serialize runs so a manual dispatch and the weekly cron can't collide on
# the shared PR branch. Queue rather than cancel — we don't want to abort a
# run that may be mid-commit.
concurrency:
  group: sync-udb-extensions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout landscape repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Clone riscv-unified-db
        run: |
          git clone --depth 1 https://github.com/riscv-software-src/riscv-unified-db.git ../riscv-unified-db

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run UDB sync
        run: node scripts/sync_udb_extensions.cjs ../riscv-unified-db

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/riscv_extensions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new extensions found in UDB."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New extension data found — opening PR."
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: 'feat: sync new supervisor extensions from riscv-unified-db'
          title: 'feat: sync new supervisor extensions from UDB'
          body: |
            Automated sync from [riscv-unified-db](https://github.com/riscv-software-src/riscv-unified-db).

            New supervisor/CSR extension data was found in UDB and has been
            added to `riscv_extensions.json`. Please review the changes
            before merging.

            Generated by the `sync-udb-extensions` workflow.
          branch: automated/sync-udb-extensions
          labels: automated,data-sync
